name: Kit Hub production release

on:
  workflow_dispatch:
    inputs:
      source:
        description: Release request source
        required: false
        default: github

concurrency:
  group: kit-hub-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Check out production source
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run quality checks
        run: npm run ci
      - name: Apply pending D1 migrations
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy production Worker
        run: npm run deploy:ci
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production health
        run: npm run verify:production
      - name: Mark verified production release
        shell: bash
        run: |
          set -euo pipefail
          command="INSERT INTO production_release_state (channel, release_id, released_at) VALUES ('production', '${{ github.sha }}', datetime('now')) ON CONFLICT(channel) DO UPDATE SET release_id = excluded.release_id, released_at = excluded.released_at"
          max_attempts=3
          attempt=1

          while true; do
            echo "Recording verified production release (attempt ${attempt}/${max_attempts})..."
            if npx wrangler d1 execute kit-hub-db --remote --command "$command"; then
              echo "Verified production release recorded."
              break
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Unable to record verified production release after ${max_attempts} attempts."
              exit 1
            fi

            delay=$((attempt * 10))
            echo "D1 write failed. Retrying in ${delay} seconds..."
            sleep "$delay"
            attempt=$((attempt + 1))
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production release marker
        run: npm run verify:production
        env:
          EXPECTED_RELEASE_ID: ${{ github.sha }}
