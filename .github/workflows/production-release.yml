name: Kit Hub production release

on:
  workflow_dispatch:
    inputs:
      source:
        description: Release request source
        required: false
        default: github

concurrency:
  group: kit-hub-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out production source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run quality checks
        run: npm run ci
      - name: Apply pending D1 migrations
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy production Worker
        run: npm run deploy:ci
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production health
        run: |
          node -e "fetch('https://kit-hub-family-platform.scarletsilverfox.workers.dev/api/health', { cache: 'no-store' }).then(async r => { const body = await r.text(); if (!r.ok) throw new Error('Health check failed: ' + r.status + ' ' + body); console.log(body); })"
      - name: Mark verified production release
        run: npx wrangler d1 execute kit-hub-db --remote --command "INSERT INTO production_release_state (channel, release_id, released_at) VALUES ('production', '${{ github.sha }}', datetime('now')) ON CONFLICT(channel) DO UPDATE SET release_id = excluded.release_id, released_at = excluded.released_at"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
